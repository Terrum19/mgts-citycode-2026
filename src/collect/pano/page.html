<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body,#p{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000}</style>
</head><body><div id="p"></div>
<script>
// Страница грузит JS API ОДИН раз; дальше capture.mjs вызывает window.shoot() для каждой точки.
const params = new URLSearchParams(location.search);
window.apiState = 'loading';
const s = document.createElement('script');
s.src = `https://api-maps.yandex.ru/2.1/?lang=ru_RU&apikey=${encodeURIComponent(params.get('key') || '')}`;
s.onload = () => ymaps.ready(() => { window.apiState = 'ready'; }, e => { window.apiState = 'error: ' + e; });
s.onerror = () => { window.apiState = 'error: script'; };
document.head.appendChild(s);

const R = 6371000, rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
function distBearing([la1, lo1], [la2, lo2]) {
  const p1 = rad(la1), p2 = rad(la2), dl = rad(lo2 - lo1);
  const a = Math.sin((p2 - p1) / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
  const dist = 2 * R * Math.asin(Math.sqrt(a));
  const y = Math.sin(dl) * Math.cos(p2);
  const x = Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl);
  return [dist, (deg(Math.atan2(y, x)) + 360) % 360];
}

const CAMERA_H = 2.7;                                        // высота камеры панорамы над землёй, м (примерно)
const TARGET_H = {manhole: 0, street_cabinet: 0.7, street_lamp: 3};  // куда смотреть по высоте, м
let player = null;

window.shoot = async (lat, lon, type, maxDist, span) => {
  let ps;
  try {
    ps = await new Promise((ok, fail) => ymaps.panorama.locate([lat, lon]).done(ok, fail));
  } catch (e) {
    return {ok: false, reason: 'locate_error', detail: String(e && (e.message || e))};
  }
  if (!ps.length) return {ok: false, reason: 'no_pano'};
  // та же панорама, но без переходов: плеер не рисует стрелки навигации поверх земли (там люки)
  const pano = Object.create(ps[0]);
  pano.getConnectionArrows = () => [];
  pano.getConnectionMarkers = () => [];
  const pos = pano.getPosition();
  const [dist, bearing] = distBearing([pos[0], pos[1]], [lat, lon]);
  if (dist > maxDist) return {ok: false, reason: 'too_far', dist};
  const pitch = deg(Math.atan2((TARGET_H[type] ?? 0) - CAMERA_H, Math.max(dist, 1)));
  const dir = [bearing, pitch];
  try {
    if (!player) {
      player = new ymaps.panorama.Player('p', pano, {
        direction: dir, span: span, controls: [], hotkeysEnabled: false,
        scrollZoomBehavior: false, suppressMapOpenBlock: true,
      });
    } else {
      await player.setPanorama(pano);
      player.setDirection(dir);
      player.setSpan(span);
    }
  } catch (e) {
    return {ok: false, reason: 'player_error', detail: String(e && (e.message || e))};
  }
  return {ok: true, pano_lat: pos[0], pano_lon: pos[1], dist, bearing, pitch,
          pano_date: (pano.getName && pano.getName()) || null};
};
</script></body></html>
