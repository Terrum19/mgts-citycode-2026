# Типы объектов и виды повреждений. На финале меняем ТОЛЬКО этот блок на список МГТС.
[taxonomy]
object_types = { manhole = "кабельный колодец / люк (круглая или прямоугольная крышка в покрытии; не ливневая решётка)", pole = "опора: фонарный столб, опора двойного назначения, столб линии связи или ЛЭП", cabinet = "уличный шкаф: связи, электрики, управления светофорами; на земле или на опоре", aerial_equipment = "оборудование связи на опоре/фасаде: оптическая муфта (чёрный цилиндр/купол), запас кабеля в кольцах, короб" }

[taxonomy.damage]
cover_broken = "колодец: крышка сломана — дыры, проломы, раскол"
cover_missing = "колодец: крышки нет, колодец открыт"
cover_open_or_shifted = "колодец: крышка сдвинута, приподнята, стоит ребром или лежит рядом"
ring_or_surface_damaged = "колодец: разрушено покрытие или кольцо вокруг, крышка просела или выступает"
pole_tilted = "опора: заметно наклонена"
pole_damaged = "опора: коррозия, разрушение основания или корпуса, повреждённая конструкция"
cables_damaged = "опора: провисшие, оборванные, спутанные или свисающие кабели"
equipment_open = "шкаф или короб: открыта или сорвана дверца/крышка"
cabinet_damaged = "шкаф: вмятины, разрушение корпуса, сильная ржавчина, вандализм"
cabinet_tilted = "шкаф: наклонён, сдвинут с цоколя"
cables_exposed = "шкаф/короб/ввод: из корпуса торчат кабели, оголённый кабель"
cable_coil_unwound = "запас кабеля размотался («борода»), висит ниже нормы"
equipment_fallen = "муфта или короб сорваны с крепления, висят на кабеле или упали"

# Короткие подписи для отчёта и картинок (на финале дописать сюда их виды повреждений)
[names]
manhole = "Колодец"
pole = "Опора"
cabinet = "Шкаф"
aerial_equipment = "Оборудование на опоре"
cover_broken = "Крышка сломана"
cover_missing = "Нет крышки"
cover_open_or_shifted = "Крышка сдвинута/открыта"
ring_or_surface_damaged = "Разрушено кольцо/покрытие"
pole_tilted = "Наклон опоры"
pole_damaged = "Повреждение опоры"
cables_damaged = "Провисшие/оборванные кабели"
equipment_open = "Открыта дверца/крышка"
cabinet_damaged = "Повреждён корпус шкафа"
cabinet_tilted = "Шкаф наклонён"
cables_exposed = "Оголённые кабели"
cable_coil_unwound = "Размотан запас кабеля"
equipment_fallen = "Оборудование сорвано"
unknown = "Повреждение (вид не определён)"
tksh = "Телекоммуникационный климатический шкаф"
rsh = "Распределительный щит"
coating_corrosion = "Повреждение ЛКП / коррозия"
mechanical_damage = "Механическое повреждение"

# Размеченные наборы для run.py. Панорамы: data/labels.json из src/label/export.py.
[datasets.pano_dev]
labels = "data/labels.json"
images = "data/raw/panoramas"
split = "dev"

[datasets.pano_test]
labels = "data/labels.json"
images = "data/raw/panoramas"
split = "test"

# 30 люков с Roboflow (24 повреждённых) — на панорамах повреждений почти нет, статус меряем здесь
[datasets.damage_manholes]
labels = "data/smoke/manholes/labels.json"
images = "data/smoke/manholes"
types = ["manhole"]   # размечены только люки: опоры на фоне не считаем ошибкой

# Детектор для варианта 1 (kind = "det_vlm"). Классы Mapillary Vistas -> наши типы.
# "Catch Basin" (ливнёвка) намеренно не берём.
[detector]
model = "weights/mask2former-mapillary"
classes = { "Manhole" = "manhole", "Utility Pole" = "pole", "Pole" = "pole", "Junction Box" = "cabinet" }
min_score = 0.5
min_side = 12        # меньше — VLM всё равно ничего не разглядит
pad = 0.2            # запас вокруг объекта при вырезе
crop_min_side = 160
shortest_edge = 800  # вход детектора; больше — точнее на мелких люках, но медленнее
device = "cpu"       # "mps" на маке, "cuda" при наличии

# Варианты = модель + endpoint. Ключ берётся из переменной окружения / .env по имени key_env.
[variants.qwen235]
base_url = "https://openrouter.ai/api/v1"
model = "qwen/qwen3-vl-235b-a22b-instruct"
key_env = "OPENROUTER_API_KEY"
workers = 6

[variants.gemma31_free]
base_url = "https://openrouter.ai/api/v1"
model = "google/gemma-4-31b-it:free"
key_env = "OPENROUTER_API_KEY"
workers = 2

[variants.nemotron_free]
base_url = "https://openrouter.ai/api/v1"
model = "nvidia/nemotron-3.5-super-vl:free"
key_env = "OPENROUTER_API_KEY"
workers = 2

# Локальный Qwen (вариант 2a): mlx_vlm.server на M4
[variants.qwen8b_local]
base_url = "http://localhost:8080/v1"
model = "mlx-community/Qwen3-VL-8B-Instruct-4bit"
key_env = ""
workers = 1

# та же Gemma, но платная (бесплатный пул часто отдаёт 429)
[variants.gemma31]
base_url = "https://openrouter.ai/api/v1"
model = "google/gemma-4-31b-it"
key_env = "OPENROUTER_API_KEY"
workers = 6

# Вариант 1: детектор -> вырез -> VLM (статус по вырезу)
[variants.det_qwen235]
kind = "det_vlm"
vlm = "qwen235"
workers = 4

# ДСС: отдельный запрос Qwen на каждую предложенную рамку ТКШ или РЩ.
[variants.det_grounding_qwen235]
kind = "grounding_qwen"
model = "weights/grounding-dino-tiny"
vlm = "qwen235"
workers = 4
min_score = 0.22
text_threshold = 0.20
min_side = 20
dedup_iou = 0.50
pad = 0.30
crop_min_side = 96

[variants.det_dino]
kind = "det_dino"
encoder = "weights/dinov2-base"
checkpoint = "weights/crop_dino.joblib"
size = 224
pad = 0.2
crop_min_side = 96
class_policy = "detector"
min_confidence = 0.55

[variants.boxes_dino]
kind = "boxes_dino"
checkpoint = "weights/crop_dino.joblib"
class_policy = "detector"
min_confidence = 0.55

[variants.photo_dino]
kind = "photo_dino"
checkpoint = "out/final/photo_dino.joblib"
